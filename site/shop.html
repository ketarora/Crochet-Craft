<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop — Crochet Craft Studio</title>
<meta name="description" content="All handmade crochet pieces: phone cases, bags, keychains, festive hampers and amigurumi. Prices in INR, pan-India shipping.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,100..900,0..100,0..1;1,9..144,100..900,0..100,0..1&family=Kalam:wght@300;400;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/css/site.css">

<body data-page="shop">
<main>

  <!-- ============ SHOP HERO BANNER ============ -->
  <section class="shop-banner">
    <div class="shop-banner__glow" aria-hidden="true"></div>
    <div class="wrap" style="position:relative;z-index:2;padding-block:clamp(2.6rem,5vw,4rem) clamp(1.6rem,3vw,2.8rem)">
      <div class="shead__k" style="color:rgba(248,241,228,.5)"><i style="background:var(--thread)"></i><span class="micro" style="color:rgba(248,241,228,.5)">The shelf · 16 handmade pieces</span></div>
      <h1 class="d h1" style="font-size:clamp(2.4rem,7vw,4.8rem);margin-top:.7rem;color:var(--paper)">Sab kuch,<br><em class="it" style="color:var(--thread)">ek jagah.</em></h1>
      <div class="flex between center wrapf mt-3" style="gap:1rem">
        <p class="lede" style="max-width:42ch;color:rgba(248,241,228,.62)">Har piece haath se banta hai. Stock mein hai toh ready — baaki made to order, 7–10 din.</p>
        <p class="micro" id="resultCount" style="letter-spacing:.14em;color:rgba(248,241,228,.4)"></p>
      </div>
      <!-- product photo strip -->
      <div style="display:flex;gap:.5rem;overflow:hidden;margin-top:2rem;border-radius:4px 4px 0 0;height:72px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)">
        <div style="flex:0 0 auto;width:72px;height:72px;border-radius:3px;overflow:hidden"><img src="assets/img/p-mini-rose-bag.jpg" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover"></div>
        <div style="flex:0 0 auto;width:72px;height:72px;border-radius:3px;overflow:hidden"><img src="assets/img/p-bow-phone-case.jpg" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover"></div>
        <div style="flex:0 0 auto;width:72px;height:72px;border-radius:3px;overflow:hidden"><img src="assets/img/p-butterfly-bag.jpg" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover"></div>
        <div style="flex:0 0 auto;width:72px;height:72px;border-radius:3px;overflow:hidden"><img src="assets/img/p-krishna-amigurumi.jpg" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover"></div>
        <div style="flex:0 0 auto;width:72px;height:72px;border-radius:3px;overflow:hidden"><img src="assets/img/p-rakhi-hamper.jpg" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover"></div>
        <div style="flex:0 0 auto;width:72px;height:72px;border-radius:3px;overflow:hidden"><img src="assets/img/p-diya-stand.jpg" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover"></div>
        <div style="flex:0 0 auto;width:72px;height:72px;border-radius:3px;overflow:hidden"><img src="assets/img/p-crochet-top.jpg" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover"></div>
        <div style="flex:0 0 auto;width:72px;height:72px;border-radius:3px;overflow:hidden"><img src="assets/img/p-wallet.jpg" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover"></div>
        <div style="flex:0 0 auto;width:72px;height:72px;border-radius:3px;overflow:hidden"><img src="assets/img/p-scrunchie.jpg" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover"></div>
        <div style="flex:0 0 auto;width:72px;height:72px;border-radius:3px;overflow:hidden"><img src="assets/img/p-lotus-hair-clip.jpg" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover"></div>
        <div style="flex:0 0 auto;width:72px;height:72px;border-radius:3px;overflow:hidden"><img src="assets/img/p-shubh-labh-hanging.jpg" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover"></div>
        <div style="flex:0 0 auto;width:72px;height:72px;border-radius:3px;overflow:hidden"><img src="assets/img/p-rakhi.jpg" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover"></div>
      </div>
    </div>
  </section>

  <!-- filter bar -->
  <div class="shopbar" style="background:var(--paper-2);border-bottom:1px solid rgba(24,17,13,.1);position:sticky;top:68px;z-index:40;backdrop-filter:blur(10px)">
    <div class="wrap"><div class="filter-row shopbar__in" id="shopFilters"></div></div>
  </div>

  <section class="sec-tight" style="padding-top:2.4rem">
    <div class="wrap"><div class="tags" id="shopGrid"></div></div>
  </section>

  <section class="band">
    <div class="wrap band__in">
      <div>
        <div class="micro" style="color:rgba(244,237,224,.65)">Nahi mila jo chahiye?</div>
        <h2 class="d h2" style="margin-top:.5rem;max-width:20ch">Custom bana lo.</h2>
      </div>
      <a class="btn" style="--bg:var(--paper);--fg:var(--rose)" href="custom.html">Open the builder <span class="ar">→</span></a>
    </div>
  </section>

</main>
<script src="assets/js/data.js"></script>
<script src="assets/js/art.js"></script>
